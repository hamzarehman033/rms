<button
  type="button"
  class="chatbot-fab"
  [class.is-open]="isOpen"
  (click)="toggle()"
  [attr.aria-label]="isOpen ? 'Close chat' : 'Ask me'"
>
  <i class="pi" [ngClass]="isOpen ? 'pi-times' : 'pi-sparkles'"></i>
  <span *ngIf="!isOpen">Ask me</span>
</button>

<div class="chatbot-panel" *ngIf="isOpen">
  <div class="chatbot-header">
    <span><i class="pi pi-sparkles"></i> Mobi</span>
    <button type="button" class="icon-btn" (click)="toggle()" aria-label="Close chat">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div #messageList class="chatbot-messages">
    <div class="muted text-sm" *ngIf="!messages.length && !isLoading">
      Ask about sites, alarms, or activities.
    </div>

    <div class="chatbot-row" *ngFor="let item of messages" [class.user]="item.role === 'user'">
      <div class="chatbot-bubble">{{ item.content }}</div>
    </div>

    <div class="chatbot-row" *ngIf="isLoading">
      <div class="chatbot-bubble muted">Thinking…</div>
    </div>
  </div>

  <div class="chatbot-error text-sm" *ngIf="error">{{ error }}</div>

  <div class="chatbot-composer">
    <input
      class="input"
      [(ngModel)]="draft"
      [disabled]="isLoading"
      (keydown)="onComposerKeydown($event)"
      placeholder="Type a message..."
      rows="2"
    />
    <button type="button" class="btn primary" [disabled]="!draft.trim() || isLoading" (click)="send()">
      Send
    </button>
  </div>
</div>
