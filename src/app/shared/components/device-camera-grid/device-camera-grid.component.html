<div class="camera-grid" [class.compact]="isCompact" *ngIf="liveCameras.length; else noCameras">
  <div class="card camera-card" *ngFor="let camera of liveCameras" [attr.data-camera-index]="camera.cameraIndex">
    <div class="hstack justify-between items-start mb-2">
      <div class="font-medium">{{ camera.name }}</div>
      <div class="hstack items-center gap-2">
        <span *ngIf="showStatusBadge" class="badge" [class.online]="camera.isStreaming" [class.offline]="!camera.isStreaming">
          ● {{ cameraStatusLabel(camera) }}
        </span>
        <button
          type="button"
          class="icon-btn"
          [disabled]="!camera.isEnabled || camera.isBusy"
          [attr.aria-label]="camera.isStreaming ? 'Stop camera' : 'Play camera'"
          [title]="camera.isStreaming ? 'Stop' : 'Play'"
          (click)="toggleCameraStream(camera)"
        >
          <i class="pi" [ngClass]="camera.isStreaming ? 'pi-stop' : 'pi-play'"></i>
        </button>
        <button
          *ngIf="camera.isStreaming"
          type="button"
          [ngClass]="showStatusBadge ? 'icon-btn' : 'camera-audio-button p-2'"
          [disabled]="camera.isBusy || camera.isAudioBusy || !camera.hasVideo"
          [attr.aria-busy]="camera.isAudioBusy"
          [attr.aria-label]="camera.isAudioConnected ? 'Disconnect audio' : 'Connect audio'"
          [title]="camera.isAudioConnected ? 'Disconnect audio' : 'Connect audio'"
          (click)="toggleCameraAudio(camera)"
        >
          <span class="camera-mic-icon" [class.mic-off]="!camera.isAudioConnected"><i class="pi pi-microphone"></i></span>
        </button>
        <button
          *ngIf="camera.isStreaming"
          type="button"
          class="icon-btn"
          [attr.aria-label]="isCameraFullscreen(camera) ? 'Exit full screen' : 'Full screen'"
          [title]="isCameraFullscreen(camera) ? 'Exit full screen' : 'Full screen'"
          (click)="toggleCameraFullscreen(camera)"
        >
          <i class="pi" [ngClass]="isCameraFullscreen(camera) ? 'pi-window-minimize' : 'pi-window-maximize'"></i>
        </button>
      </div>
    </div>
    <div class="camera-viewport">
      <video
        class="w-full h-full object-cover"
        #cameraVideo
        [attr.data-camera-index]="camera.cameraIndex"
        autoplay
        playsinline
        muted
      ></video>
    </div>
    <audio
      #cameraAudio
      class="camera-audio w-full"
      [hidden]="!camera.isAudioConnected"
      controls
      [attr.data-camera-index]="camera.cameraIndex"
      autoplay
      playsinline
    ></audio>
    <div *ngIf="!camera.hasVideo" [class.text-xs]="showStatusBadge">
      {{ cameraViewportLabel(camera) }}
    </div>
  </div>
</div>
<ng-template #noCameras>
  <div class="card camera-card">
    <div class="camera-viewport muted text-xs">No cameras configured</div>
  </div>
</ng-template>
