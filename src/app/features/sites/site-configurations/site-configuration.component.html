<form [formGroup]="configForm" (ngSubmit)="submitConfiguration()" class="vstack gap-6">
  <!-- Rectifier Section -->
  <div formGroupName="rectifier" class="config-section">
    <h4 class="text-lg font-bold mb-3">Rectifier</h4>
    <div class="grid cols-3 gap-3">
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Brand</label>
        <input type="text" formControlName="brand" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter brand" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Quantity</label>
        <input type="number" formControlName="qty" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="0" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Capacity</label>
        <input type="text" formControlName="capacity" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="e.g., 100 kW" />
      </div>
    </div>
  </div>

  <!-- Battery Section -->
  <div formGroupName="battery" class="config-section border-t border-surface-border pt-6">
    <div class="flex items-center gap-2 mb-3">
      <input type="checkbox" id="batteryEnabled" [checked]="isSectionEnabled('Battery')" (change)="setSectionEnabled('Battery', $any($event.target).checked)" class="w-4 h-4 cursor-pointer" />
      <label for="batteryEnabled" class="text-lg font-bold cursor-pointer">Battery</label>
    </div>
    <div *ngIf="isSectionEnabled('Battery')" class="grid cols-3 gap-3">
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Brand</label>
        <input type="text" formControlName="brand" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter brand" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Quantity</label>
        <input type="number" formControlName="qty" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="0" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Capacity</label>
        <input type="text" formControlName="capacity" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="e.g., 500 Ah" />
      </div>
    </div>
  </div>

  <!-- Solar Section -->
  <div formGroupName="solar" class="config-section border-t border-surface-border pt-6">
    <div class="flex items-center gap-2 mb-3">
      <input type="checkbox" id="solarEnabled" [checked]="isSectionEnabled('Solar')" (change)="setSectionEnabled('Solar', $any($event.target).checked)" class="w-4 h-4 cursor-pointer" />
      <label for="solarEnabled" class="text-lg font-bold cursor-pointer">Solar</label>
    </div>
    <div *ngIf="isSectionEnabled('Solar')" class="grid cols-3 gap-3">
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Brand</label>
        <input type="text" formControlName="brand" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter brand" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Quantity</label>
        <input type="number" formControlName="qty" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="0" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Capacity</label>
        <input type="text" formControlName="capacity" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="e.g., 50 kWp" />
      </div>
    </div>
  </div>

  <!-- Generator Section -->
  <div formGroupName="generator" class="config-section border-t border-surface-border pt-6">
    <div class="flex items-center gap-2 mb-3">
      <input type="checkbox" id="generatorEnabled" [checked]="isSectionEnabled('Generator')" (change)="setSectionEnabled('Generator', $any($event.target).checked)" class="w-4 h-4 cursor-pointer" />
      <label for="generatorEnabled" class="text-lg font-bold cursor-pointer">Generator</label>
    </div>
    <div *ngIf="isSectionEnabled('Generator')" class="grid cols-3 gap-3">
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Brand</label>
        <input type="text" formControlName="brand" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter brand" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Quantity</label>
        <input type="number" formControlName="qty" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="0" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Capacity</label>
        <input type="text" formControlName="capacity" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="e.g., 100 kVA" />
      </div>
    </div>
  </div>

  <!-- Additional Fields Section -->
  <div class="config-section border-t border-surface-border pt-6">
    <div class="grid cols-2 gap-4 mb-4">
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">RMS Device Serial Number</label>
        <input type="text" formControlName="rmsSerialNumber" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter serial number" />
      </div>
      <div class="vstack gap-1">
        <label class="text-sm font-semibold">Sim Card Number</label>
        <input type="text" formControlName="simCardNumber" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter SIM card number" />
      </div>
    </div>

    <div class="config-section border-t border-surface-border pt-6 mb-4" formArrayName="cameras">
      <div class="flex items-center justify-between mb-3">
        <h4 class="text-lg font-bold">Cameras</h4>
        <button type="button" class="btn secondary" [disabled]="!canAddCamera" (click)="addCamera()">
          <i class="pi pi-plus"></i>
          <span>Add Camera</span>
        </button>
      </div>

      <div *ngIf="cameras.length === 0" class="text-sm muted mb-4">No cameras configured.</div>

      <div *ngFor="let camera of cameras.controls; let i = index" [formGroupName]="i" class="grid cols-2 gap-3 mb-3">
        <div class="vstack gap-1">
          <label class="text-sm font-semibold">{{ cameraLabel(i) }}</label>
          <input type="text" formControlName="name" class="px-3 py-2 rounded border border-surface-border bg-surface-0 text-foreground" placeholder="Enter camera name" />
        </div>
        <div class="flex items-end justify-between gap-3">
          <div class="flex items-center gap-2 pb-2">
            <input type="checkbox" [id]="'cameraEnabled' + i" formControlName="isEnabled" class="w-4 h-4 cursor-pointer" />
            <label [for]="'cameraEnabled' + i" class="text-sm font-semibold cursor-pointer">Enabled</label>
          </div>
          <button type="button" class="btn secondary" (click)="removeCamera(i)" title="Remove camera">
            <i class="pi pi-trash"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="grid cols-2 gap-4 mb-4">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="aiEhs" formControlName="aiEhsInstalled" class="w-4 h-4 cursor-pointer" />
        <label for="aiEhs" class="text-sm font-semibold cursor-pointer">AI EHS Installed</label>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="aiSecurity" formControlName="aiSecurityInstalled" class="w-4 h-4 cursor-pointer" />
        <label for="aiSecurity" class="text-sm font-semibold cursor-pointer">AI Security Installed</label>
      </div>
    </div>
  </div>

  <div class="hstack gap-2 justify-end border-t border-surface-border pt-6">
    <button type="button" (click)="closeConfiguration()" class="btn secondary">Cancel</button>
    <button type="submit" [disabled]="!configForm.valid" class="btn primary">Save Configuration</button>
  </div>
</form>
