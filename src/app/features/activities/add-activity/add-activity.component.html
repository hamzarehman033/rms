<form [formGroup]="activityForm" class="form-section">
    <div class="form-group">
        <label for="name">Activity Name</label>
        <input id="name" pInputText type="text" formControlName="name" placeholder="Enter activity name"
            class="w-full" />
        <small class="error" *ngIf="activityForm.get('name')?.invalid && activityForm.get('name')?.touched">
            Activity name is required and must be at least 2 characters
        </small>
    </div>

    <div class="form-group">
        <label for="siteId">Site</label>
        <p-dropdown id="siteId" formControlName="siteId" [options]="sites" optionLabel="label" optionValue="value"
            placeholder="Select site" class="w-full" [filter]="true"></p-dropdown>
        <small class="error" *ngIf="activityForm.get('siteId')?.invalid && activityForm.get('siteId')?.touched">
            Site is required
        </small>
    </div>

    <div class="form-group">
        <label for="date">Date</label>
        <input id="date" pInputText type="date" formControlName="date" class="w-full" />
        <small class="error" *ngIf="activityForm.get('date')?.invalid && activityForm.get('date')?.touched">
            Date is required
        </small>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="form-group">
            <label for="startTime">Time Start</label>
            <input id="startTime" pInputText type="time" formControlName="startTime" class="w-full" />
            <small class="error" *ngIf="activityForm.get('startTime')?.invalid && activityForm.get('startTime')?.touched">
                Start time is required
            </small>
        </div>
        <div class="form-group">
            <label for="endTime">Time End</label>
            <input id="endTime" pInputText type="time" formControlName="endTime" class="w-full" />
            <small class="error" *ngIf="activityForm.get('endTime')?.invalid && activityForm.get('endTime')?.touched">
                End time is required
            </small>
        </div>
    </div>
    <small class="error" *ngIf="activityForm.hasError('timeRange') && activityForm.touched">
        End time must be after start time
    </small>

    <div class="form-group">
        <label for="company">Company</label>
        <input id="company" pInputText type="text" formControlName="company" placeholder="Enter company name"
            class="w-full" />
        <small class="error" *ngIf="activityForm.get('company')?.invalid && activityForm.get('company')?.touched">
            Company is required
        </small>
    </div>

    <div class="form-group">
        <label for="technicians">Technicians</label>
        <p-inputNumber id="technicians" formControlName="technicians" [min]="1" [showButtons]="true"
            placeholder="Total persons involved" class="w-full"></p-inputNumber>
        <small class="muted">Total persons involved</small>
        <small class="error" *ngIf="activityForm.get('technicians')?.invalid && activityForm.get('technicians')?.touched">
            At least 1 technician is required
        </small>
    </div>
</form>

<div class="form-actions pt-2" dialogFooter>
    <button type="button" pButton label="Cancel" icon="pi pi-times" class="p-button-secondary"
        (click)="resetForm()" [disabled]="isLoading"></button>
    <button type="submit" pButton [label]="isLoading ? 'Scheduling...' : 'Schedule Activity'" icon="pi pi-check"
        [disabled]="!activityForm.valid || isLoading" [loading]="isLoading" (click)="onSubmit()"></button>
</div>
