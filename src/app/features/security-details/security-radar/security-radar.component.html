<div class="security-radar-card" [class.has-intrusion]="hasActiveIntrusion">
  <div class="radar-heading">
    <span class="radar-heading-label"><i class="pi pi-compass" aria-hidden="true"></i> Security Radar</span>
    <span class="radar-status" [class.alert]="hasActiveIntrusion">
      <span class="radar-status-dot" aria-hidden="true"></span>
      {{ hasActiveIntrusion ? 'INTRUSION' : 'SCANNING' }}
    </span>
  </div>

  <div class="radar-screen" role="img"
       [attr.aria-label]="(hasActiveIntrusion ? 'Intrusion alert. ' : '') + '360 degree radar. Radar A above the centre, Radar B below. ' + dots.length + ' live targets shown. Maximum range 8 metres.'">
    <!-- All geometry shares the centre of the full circle; the sweep is decorative. -->
    <svg viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient [id]="gradientId" gradientUnits="userSpaceOnUse" cx="180" cy="180" r="160">
          <stop offset="0%" stop-color="#14532d" stop-opacity="0.56"/>
          <stop offset="100%" stop-color="#06140d" stop-opacity="0.08"/>
        </radialGradient>
      </defs>

      <circle cx="180" cy="180" r="160" [attr.fill]="'url(#' + gradientId + ')'" class="radar-rim"/>
      <g class="radar-grid">
        <circle cx="180" cy="180" r="120"/>
        <circle cx="180" cy="180" r="80"/>
        <circle cx="180" cy="180" r="40"/>
        <path d="M180 20 V340 M67 67 L293 293 M67 293 L293 67"/>
      </g>
      <path class="radar-divider" d="M20 180 H340"/>

      <g class="radar-sweep">
        <path d="M180 180 L125 30 A160 160 0 0 1 180 20 Z" fill="rgba(83, 238, 139, 0.12)"/>
        <line class="radar-needle" x1="180" y1="180" x2="180" y2="20"/>
      </g>

      <!-- Preserve the camera-only/retained alert cue without inventing a target location. -->
      @if (hasActiveIntrusion && dots.length === 0) {
        <g class="radar-origin-alert">
          <circle class="radar-alert-wave" cx="180" cy="180" r="160"/>
          <circle class="radar-alert-wave radar-alert-wave-delayed" cx="180" cy="180" r="160"/>
        </g>
      }

      <!-- These labels identify sensor sectors, not compass headings. -->
      <g class="radar-sector-labels">
        <text x="18" y="29">RADAR A</text>
        <text x="18" y="342">RADAR B</text>
        <text x="342" y="29" text-anchor="end" class="radar-range-label">8 m</text>
      </g>
      <circle class="radar-origin" cx="180" cy="180" r="3"/>

      <!-- Targets keep their exact coordinates; only their alarm treatment changes on review. -->
      @for (dot of dots; track dot.radarId + ':' + dot.slot) {
        <g class="radar-target" [attr.data-target]="(dot.radarId === 1 ? 'A' : 'B') + dot.slot"
           [attr.transform]="'translate(' + dot.x + ' ' + dot.y + ')'">
          <title>Radar {{ dot.radarId === 1 ? 'A' : 'B' }}, slot {{ dot.slot }}: {{ dot.angleDeg }} degrees, {{ dot.distanceMm }} mm, {{ dot.speedCmps }} cm/s</title>
          <circle class="radar-target-halo" r="10"/>
          <circle class="radar-target-dot" r="4.5"/>
          <text class="radar-target-label" [attr.x]="dot.x > 300 ? -9 : 9" y="-8"
                [attr.text-anchor]="dot.x > 300 ? 'end' : 'start'">{{ dot.radarId === 1 ? 'A' : 'B' }}{{ dot.slot }}</text>
        </g>
      }
    </svg>
  </div>
</div>
