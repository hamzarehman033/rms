<div class="security-radar-card" [class.has-intrusion]="hasActiveIntrusion">
  <div class="radar-heading">
    <span class="radar-heading-label"><i class="pi pi-compass"></i> Security Radar</span>
    <span class="radar-status" [class.alert]="hasActiveIntrusion">{{ hasActiveIntrusion ? 'DETECTION' : 'SCANNING' }}</span>
  </div>

  <div class="radar-screen" role="img"
       [attr.aria-label]="hasActiveIntrusion ? 'Intrusion alert; pulses indicate detection, not a target position' : 'Radar scanning; no active intrusion'">
    <!-- The grid, needle and alarm pulses share exactly the same SVG origin. -->
    <svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="securityRadarGlow" gradientUnits="userSpaceOnUse" cx="180" cy="190" r="174">
          <stop offset="0%" stop-color="#14532d" stop-opacity="0.56"/>
          <stop offset="100%" stop-color="#06140d" stop-opacity="0.08"/>
        </radialGradient>
        <clipPath id="securityRadarClip" clipPathUnits="userSpaceOnUse">
          <path d="M6 190 A174 174 0 0 1 354 190 Z"/>
        </clipPath>
      </defs>

      <path d="M6 190 A174 174 0 0 1 354 190 Z" fill="url(#securityRadarGlow)" stroke="#2f9b53" stroke-width="1.5"/>
      <path d="M47 190 A133 133 0 0 1 313 190 M89 190 A91 91 0 0 1 271 190 M133 190 A47 47 0 0 1 227 190" fill="none" stroke="#256a3e" stroke-width="1"/>
      <path d="M6 190 H354 M180 16 V190 M56 67 L180 190 M304 67 L180 190 M94 39 L180 190 M266 39 L180 190" stroke="#27693d" stroke-width="0.8"/>

      <g clip-path="url(#securityRadarClip)">
        <g class="radar-sweep">
          <path d="M180 190 L138 21 A174 174 0 0 1 180 16 Z" fill="rgba(83, 238, 139, 0.12)"/>
          <line class="radar-needle" x1="180" y1="190" x2="180" y2="16"/>
        </g>
        <!-- Expanding semicircles communicate an alarm, never a measured location. -->
        <g *ngIf="hasActiveIntrusion" class="radar-origin-alert">
          <circle class="radar-alert-wave" cx="180" cy="190" r="174" vector-effect="non-scaling-stroke"/>
          <circle class="radar-alert-wave radar-alert-wave-delayed" cx="180" cy="190" r="174" vector-effect="non-scaling-stroke"/>
        </g>
      </g>
      <circle class="radar-origin" cx="180" cy="190" r="3"/>
    </svg>

    <div *ngIf="hasActiveIntrusion" class="radar-intrusion-label">
      <i class="pi pi-exclamation-triangle"></i>
      INTRUSION ALERT
    </div>
  </div>
</div>
