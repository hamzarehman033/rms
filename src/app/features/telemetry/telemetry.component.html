<main class="content">
  <div class="page-header">
    <div>
      <h1>Telemetry</h1>
      <p>Live device packet values</p>
    </div>
  </div>

  <div class="card p-0">
    <p-table
      [value]="rows"
      [loading]="isLoading"
      styleClass="p-datatable-sm"
      responsiveLayout="scroll"
      scrollHeight="70vh"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Site</th>
          <th>Code</th>
          <th>Packets</th>
          <th>Last packet</th>
          <th *ngFor="let col of columns">{{ col }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.name }}</td>
          <td class="mono">{{ row.code || '—' }}</td>
          <td class="mono">{{ row.packetCount }}</td>
          <td class="mono text-xs">{{ row.lastPacketAt ? (row.lastPacketAt | date: 'medium') : '—' }}</td>
          <td *ngFor="let col of columns" class="mono text-xs">{{ val(row.packet, col) }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="columns.length + 4" class="text-center py-8 muted">No devices found</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</main>
